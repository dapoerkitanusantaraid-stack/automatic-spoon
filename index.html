<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .filter-section {
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .filter-section label {
            margin-right: 10px;
            font-weight: bold;
            color: #333;
        }

        .filter-section select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            background-color: white;
            transition: all 0.3s ease;
        }

        .filter-section select:hover {
            border-color: #764ba2;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        .konten-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .konten-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .konten-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .konten-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .konten-info {
            padding: 20px;
        }

        .konten-kategori {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .konten-info h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .konten-info p {
            color: #666;
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .konten-tanggal {
            font-size: 0.85em;
            color: #999;
            margin-top: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            position: relative;
        }

        .modal-header h2 {
            margin: 0 0 10px 0;
            font-size: 1.8em;
        }

        .modal-kategori {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 32px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close:hover {
            background: rgba(255,255,255,0.4);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px 20px;
        }

        .modal-body h3 {
            color: #333;
            margin-top: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .modal-body p {
            color: #666;
            line-height: 1.8;
            font-size: 1em;
            margin-bottom: 15px;
        }

        .galeri-container {
            margin-top: 30px;
        }

        .galeri-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .galeri-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .galeri-item:hover {
            transform: scale(1.05);
        }

        .galeri-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            transition: all 0.3s ease;
        }

        .galeri-item:hover img {
            filter: brightness(0.8);
        }

        .galeri-item-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(102, 126, 234, 0.7);
            opacity: 0;
            transition: opacity 0.3s ease;
            color: white;
            font-size: 2em;
        }

        .galeri-item:hover .galeri-item-overlay {
            opacity: 1;
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .konten-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
                margin: 20% auto;
            }

            .galeri-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 Project Server</h1>
            <p>Klik link untuk melihat isi data, galeri, dan informasi lengkap</p>
        </header>

        <div class="filter-section">
            <label for="kategoriFilter">🏷️ Filter Kategori:</label>
            <select id="kategoriFilter">
                <option value="">Semua Kategori</option>
                <option value="promo">Promo</option>
                <option value="artikel">Artikel</option>
                <option value="produk">Produk</option>
                <option value="berita">Berita</option>
                <option value="event">Event</option>
            </select>
        </div>

        <div id="kontenContainer" class="konten-grid">
            <div class="loader">⏳ Loading konten...</div>
        </div>
    </div>

    <!-- Modal Detail Konten -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <span class="modal-kategori" id="modalKategori"></span>
                <button class="close">&times;</button>
            </div>
            <div class="modal-body">
                <img id="modalGambar" style="width: 100%; border-radius: 10px; margin-bottom: 20px;">
                <p id="modalDeskripsi"></p>
                
                <h3>📝 Isi Detail</h3>
                <div id="modalIsi"></div>
                
                <div class="galeri-container">
                    <h3>🖼️ Galeri</h3>
                    <div id="galeriBig" class="galeri-grid"></div>
                    <p id="galeriBigEmpty" style="color: #999; margin-top: 15px;">Tidak ada gambar galeri</p>
                </div>

                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
                    <small id="modalTanggal" style="color: #999;"></small>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const modal = document.getElementById('detailModal');
        const closeBtn = document.querySelector('.close');

        // Load semua konten
        async function loadKonten(kategori = '') {
            try {
                const kontenContainer = document.getElementById('kontenContainer');
                kontenContainer.innerHTML = '<div class="loader">⏳ Loading konten...</div>';

                let url = `${API_BASE}/konten`;
                if (kategori) {
                    url = `${API_BASE}/kategori/${kategori}`;
                }

                const response = await fetch(url);
                const data = await response.json();
                const kontenList = data.data || [];

                if (kontenList.length === 0) {
                    kontenContainer.innerHTML = `
                        <div class="empty-state">
                            <h2>📭 Konten Tidak Ditemukan</h2>
                            <p>Coba pilih kategori lain atau kembali ke semua konten</p>
                        </div>
                    `;
                    return;
                }

                kontenContainer.innerHTML = '';
                kontenList.forEach(konten => {
                    const card = createKontenCard(konten);
                    kontenContainer.appendChild(card);
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('kontenContainer').innerHTML = `
                    <div class="error-message">❌ Gagal memuat konten. Pastikan server berjalan di ${API_BASE}</div>
                `;
            }
        }

        // Buat card konten
        function createKontenCard(konten) {
            const card = document.createElement('div');
            card.className = 'konten-card';
            
            const tanggal = new Date(konten.tanggal).toLocaleDateString('id-ID', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            card.innerHTML = `
                <img src="${konten.gambar_utama || 'https://via.placeholder.com/300x200?text=No+Image'}" alt="${konten.judul}">
                <div class="konten-info">
                    <span class="konten-kategori">${konten.kategori}</span>
                    <h3>${konten.judul}</h3>
                    <p>${konten.deskripsi.substring(0, 100)}...</p>
                    <div class="konten-tanggal">📅 ${tanggal}</div>
                </div>
            `;

            card.addEventListener('click', () => openDetail(konten.id));
            return card;
        }

        // Buka detail konten
        async function openDetail(kontenId) {
            try {
                const response = await fetch(`${API_BASE}/konten/${kontenId}`);
                if (!response.ok) throw new Error('Konten tidak ditemukan');
                
                const konten = await response.json();
                
                document.getElementById('modalTitle').textContent = konten.judul;
                document.getElementById('modalKategori').textContent = konten.kategori;
                document.getElementById('modalGambar').src = konten.gambar_utama || 'https://via.placeholder.com/800x400?text=No+Image';
                document.getElementById('modalDeskripsi').textContent = konten.deskripsi;
                document.getElementById('modalIsi').innerHTML = `<p>${konten.isi.replace(/\n/g, '<br>')}</p>`;
                
                const tanggal = new Date(konten.tanggal).toLocaleDateString('id-ID', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                document.getElementById('modalTanggal').textContent = `Dipublikasikan: ${tanggal}`;

                // Load galeri
                loadGaleri(kontenId);

                modal.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                alert('Gagal memuat detail konten');
            }
        }

        // Load galeri
        async function loadGaleri(kontenId) {
            try {
                const response = await fetch(`${API_BASE}/konten/${kontenId}/galeri`);
                const data = await response.json();
                const galeriContainer = document.getElementById('galeriBig');
                const galeriEmpty = document.getElementById('galeriBigEmpty');

                galeriContainer.innerHTML = '';

                if (data.galeri.length === 0) {
                    galeriEmpty.style.display = 'block';
                } else {
                    galeriEmpty.style.display = 'none';
                    data.galeri.forEach(gambar => {
                        const item = document.createElement('div');
                        item.className = 'galeri-item';
                        item.innerHTML = `
                            <img src="${gambar.url}" alt="${gambar.deskripsi}">
                            <div class="galeri-item-overlay">👁️</div>
                        `;
                        item.addEventListener('click', () => openGaleriModal(gambar.url, gambar.deskripsi));
                        galeriContainer.appendChild(item);
                    });
                }
            } catch (error) {
                console.error('Error loading galeri:', error);
                document.getElementById('galeriBigEmpty').style.display = 'block';
            }
        }

        // Buka gambar galeri
        function openGaleriModal(url, deskripsi) {
            window.open(url, '_blank');
        }

        // Close modal
        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Filter kategori
        document.getElementById('kategoriFilter').addEventListener('change', (e) => {
            loadKonten(e.target.value);
        });

        // Initial load
        loadKonten();
    </script>
</body>
</html>
