name: CI

on:
  push:
    branches: [ main, codespace-automatic-spoon-7vqw47jjrqrwhpqp6 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install dev tools (lint & security)
        run: |
          pip install flake8 bandit pip-audit
      - name: Lint code (flake8)
        run: |
          flake8 . --max-line-length=120 || true
      - name: Security scan (bandit)
        run: |
          bandit -r server -ll || true
      - name: Dependency audit (pip-audit)
        run: |
          pip-audit --progress=off || true
      - name: Run tests
        run: |
          pytest -q
